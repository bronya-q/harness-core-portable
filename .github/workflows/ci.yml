name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with MCP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
        # 不设 || 回退：MCP SDK 集成安装失败必须暴露，不能用核心安装成功掩盖。
      - name: Release verify
        run: python release_verify.py
      - name: Package selfcheck
        run: python package_selfcheck.py
      - name: Unit tests
        run: python -m unittest discover
      - name: R2 local checks
        env:
          HARNESS_MCP_ADAPTER_ID: harness-core-mcp
        run: |
          python harness.py secret-scan
          python harness.py secret-scan --history
          python harness.py boundary-check
          python harness.py boundary-check --history
          python harness.py runtime-coverage
          python harness.py mcp-verify
          python harness.py release-checklist
