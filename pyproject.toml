[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-core-portable"
version = "0.1.0a3"
description = "Local-first AI role memory, context visibility, and persona/knowledge/engineering runtime."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "bronya-q"}]
keywords = ["local-first", "agent-memory", "persona", "mcp", "llm-observability", "context-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
test = ["unittest"]

[project.scripts]
harness-core-mcp = "harness_core.adapters.mcp_server:main"

[tool.setuptools.packages.find]
include = ["harness_core*"]
